<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="script.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <main class="flex flex-col gap-10 mx-20">
        <section class="flex justify-between mt-10">
            <h2>Shopping Cart</h2>
            <button id="remove-all-btn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-medium rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-all">Remove All</button>
        </section>
        <section class="flex justify-end items-center gap-10">
            <label for="item-name">Item Name
                <input type="text" id="item-name" class="border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500" placeholder="Type here...">
            </label>
            <label for="item-price">Price
                <input type="number" id="item-price" min="0" step="0.01" class="border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500" placeholder="Type here...">
            </label>
            <button id="add-item" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-medium rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-all">Add to Cart</button>
        </section>
        <section class="flex flex-col">
            <ul id="shopping-list">
            </ul>
        </section>
        <h3>Total: $<span id="total-price">0</span></h3>
    </main>
</body>
</html>
